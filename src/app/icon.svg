<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.30" r="0.75">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#a78bfa" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="u" x1="0.15" y1="0.1" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="0.6" stop-color="#dfe8ff"/>
      <stop offset="1" stop-color="#c3d2f5"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c5cf0"/>
    </radialGradient>
  </defs>

  <!-- rounded-square backdrop -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- U monogram, drawn as a thick round-cap stroke (font-independent) -->
  <path d="M 168 168 L 168 268 A 76 76 0 0 0 320 268 L 320 168"
        fill="none" stroke="url(#u)" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- violet ".tv" accent dot -->
  <circle cx="366" cy="332" r="33" fill="url(#dotGlow)"/>
</svg>
